# Runs the project's own checks: the phase cross-checks (GOVERNANCE §5), source integrity, schema validation,
# and a reproducibility gate — every generated report must come out byte-identical to what is committed.
# Replaces GitHub's starter Python workflow, which ran pytest on a repo with no tests (failed on every push).

name: Cross-checks

on:
  push:
    branches: [ "main", "fix/ci-**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install system tools
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 -r requirements.txt -c .github/ci-constraints.txt
    - name: Lint — syntax errors and undefined names only
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Source integrity
      run: sha256sum -c 00_source/MANIFEST.sha256
    - name: Schema validation
      run: xmllint --noout --schema 03_schema/decision-maker-study.xsd 03_schema/examples/*.xml 03_schema/tests/*.xml
    - name: Phase cross-checks
      run: |
        fail=0
        for p in scripts/p[0-9]_crosscheck.py; do
          echo "::group::$p"
          if ! python -I "$p" > "/tmp/$(basename $p).log" 2>&1; then
            fail=1
            # Annotations are readable without signing in, so each failing check is reported as one.
            grep -E " FAIL |Error|Traceback" "/tmp/$(basename $p).log" | head -20 | while IFS= read -r line; do
              echo "::error title=$(basename $p)::${line:0:900}"
            done
          fi
          cat "/tmp/$(basename $p).log"
          echo "::endgroup::"
        done
        exit $fail
    - name: Reproducibility — generated outputs unchanged
      if: always()
      run: |
        git status --short
        if ! git diff --quiet; then
          git diff --stat | head -30 | while IFS= read -r line; do echo "::error title=changed output::$line"; done
          exit 1
        fi
